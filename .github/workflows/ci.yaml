name: Continuous Integration

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - rc
      - dev
      - feature/*
 
permissions:
  contents: write
  packages: write
  repository-projects: write

jobs:
  build:
    uses: codedesignplus/workflows/.github/workflows/build-microservice.yaml@main
    with:
      project-name: CodeDesignPlus.Net.Microservice
      microservice-name: ms-archetype
      environment: Development
    secrets: inherit
  
  # SonarQube queda fuera por ahora: el CI se enciende primero con build y los guardrails, y este job
  # vuelve cuando los 35 repositorios esten en verde. Se comenta y no se borra para no reescribirlo.
  # sonarqube:
  #   needs: build
  #   if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/rc' || github.ref == 'refs/heads/dev' }}
  #   uses: codedesignplus/workflows/.github/workflows/sonarqube.yaml@main
  #   with:
  #     project-name: CodeDesignPlus.Net.Microservice
  #     microservice-name: ms-archetype
  #     environment: Development
  #   secrets: inherit

  money-guardrails:
    uses: codedesignplus/workflows/.github/workflows/money-guardrails.yaml@main
    with:
      runner: ubuntu-latest
    secrets: inherit
